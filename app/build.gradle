plugins {
    id 'com.android.application'
}
android {
    namespace 'jp.voicetally.app'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.voicetally.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
